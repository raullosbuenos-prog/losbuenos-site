name: Deploy LosBuenos to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare lean static site
        shell: bash
        run: |
          set -euo pipefail
          SITE_DIR="$RUNNER_TEMP/losbuenos-pages"
          mkdir -p "$SITE_DIR"
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/assets/Materiais (arrumar)/' \
            ./ "$SITE_DIR/"
          FONT_SOURCE="assets/Materiais (arrumar)/ETAPA 1. Identidade e base visual/3 - Fontes"
          FONT_PARENT="$SITE_DIR/assets/Materiais (arrumar)/ETAPA 1. Identidade e base visual"
          mkdir -p "$FONT_PARENT"
          cp -a "$FONT_SOURCE" "$FONT_PARENT/"
          echo "Original repository size:"
          du -sh ./assets || true
          echo "Deploy directory size:"
          du -sh "$SITE_DIR"

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/losbuenos-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
